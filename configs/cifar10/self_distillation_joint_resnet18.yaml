# Joint self-distillation baseline (implicit predictor step, asymmetric loss), CIFAR-style
# ResNet-18 on CIFAR-10, 1000 epochs, batch size 256, LARS, 1 GPU. Figure G.7.
meta:
  seed: 42  # paper: seeds 42, 43, 44
  device: auto

data:
  dataset: cifar10  # downloaded into $EBJEPA_DSETS
  batch_size: 256
  num_workers: 4

model:
  type: resnet
  resnet_arch: resnet18  # 3x3 conv1, no max-pool at 32x32
  use_projector: true
  proj_hidden_dim: 2048
  proj_output_dim: 1024  # k

init:
  scale: 1.0

loss:
  type: self_distillation_joint
  symmetric: false
  reg: 0.0001
  lr: 0.01      # implicit predictor step size, not a covariance EMA rate
  lr_min: 0.01

optim:
  type: lars  # solo-learn style LARS (clip_lr, biases/norms excluded)
  epochs: 1000
  lr: 0.001
  weight_decay: 1.0e-4
  momentum: 0.9
  lars_eta: 0.02
  warmup_epochs: 10
  warmup_start_lr: 3.0e-5
  min_lr: 0.0
  grad_clip: null
  clip_epoch: 0

logging:
  log_every: 10
  save_every: 0  # latest.pth.tar only; positive values enable epoch snapshots
  spectral_every: 10  # spectrum/alignment for the diagnostics figure
  tqdm_silent: false

training:
  use_amp: true
  dtype: bfloat16
